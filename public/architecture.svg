kers and phase outcomes</text><path d="M870 1323 H520" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="180" y="1403" fill="#142d53" font-family="Arial" font-size="24">13. Format the answer and expose safe fixture contents</text><path d="M520 1421 H170" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/></svg>